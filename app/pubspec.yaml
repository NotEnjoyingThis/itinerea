name: itinerea
description: "Open source trip and road trip planner for car and motorbike."
publish_to: 'none'

# build-name+build-number. On Android the build number is the versionCode.
version: 0.0.1+1

environment:
  sdk: ^3.14.0

dependencies:
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Generates lib/l10n/generated/ from the ARB files (see l10n.yaml).
  generate: true
  uses-material-design: true
  # Licence texts of the bundled fonts, shown in the licences page.
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Manrope-OFL.txt
  # Variable fonts (one file per family, every weight), bundled with the app:
  # nothing is downloaded at run time. See docs/DESIGN.md, section 3.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
