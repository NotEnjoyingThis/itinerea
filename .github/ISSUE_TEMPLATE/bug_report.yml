name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please do not include personal data (real bookings, tickets, addresses, tokens).
        Security problems must be reported privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - Windows
        - macOS
        - Linux
        - iOS (self-built)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Itinerea version
      description: Shown in Settings → About, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the app?
      options:
        - GitHub Releases
        - Google Play
        - F-Droid
        - Flathub
        - Built from source
  - type: input
    id: os-version
    attributes:
      label: Operating system version and device
      placeholder: Android 15, Pixel 7
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or logs, with personal data removed.
