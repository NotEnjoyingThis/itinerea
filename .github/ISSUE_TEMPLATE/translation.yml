name: Translation
description: Report a wrong, unclear or missing translation
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Italian
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where does the text appear?
      placeholder: Settings → Theme
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is it better?
      description: Optional. Screenshots are welcome.
